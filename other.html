<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="filter-section">
  <h3>Filter Other Items</h3>

  <!-- Item Type -->
  <label for="type">Type:</label>
  <input type="text" id="type" placeholder="e.g. Sports Gear, Furniture">

  <!-- Condition -->
  <label for="condition">Condition:</label>
  <select id="condition">
    <option value="">All</option>
    <option value="new">New</option>
    <option value="like-new">Like New</option>
    <option value="good">Good</option>
    <option value="fair">Fair</option>
  </select>

  <!-- Price -->
  <label for="maxPrice">Max Price:</label>
  <input type="number" id="maxPrice" placeholder="e.g. 1000">

  <!-- Keyword -->
  <label for="keyword">Keyword:</label>
  <input type="text" id="keyword" placeholder="Search keyword">

  <button onclick="applyOtherFilters()">Apply Filters</button>
</div>
</body>
</html>
